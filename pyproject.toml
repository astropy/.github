[tool.gilesbot]
[tool.gilesbot.pull_requests]
enabled = true

[tool.gilesbot.org_vetting]
enabled = true
allowlist = "https://raw.githubusercontent.com/astropy/.github/main/contributor-allowlist.txt"
message = """
Hi 👋 and thank you for your contribution! 🙏

This pull request is being closed automatically - but don't worry, we may re-open it if you carefully follow these instructions.

Join the astropy slack using [this invite link](https://join.slack.com/t/astropy/shared_invite/zt-4c1p8lbom-GuaB46o3rPd0ZRJh6MR_kQ), head over to the **#new-contributor-requests** channel, and introduce yourself with a post that includes:

1. Background about your current occupation or affiliation.

2. How the bug or missing feature affects your work.

We strongly encourage contributions from people that use astropy or actively develop related scientific Python packages. We look forward to hearing from you and growing the Astropy community!
"""
maintainer_preamble = """
If you know this is a genuine user and the PR is is compliance with the [AI policy](https://github.com/astropy/astropy-project/blob/main/policies/ai-policy.md), you may re-open this straight away. After two successful merged pull requests, the user will be added to the allowlist and future PRs will no longer be closed automatically.
"""

